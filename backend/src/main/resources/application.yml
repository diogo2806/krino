server:
  port: ${PORT:8080}

spring:
  application:
    name: krino-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

krino:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
